erview.jpg",photoCaption:"실제 도심지 대심도 지하정거장 굴착 현장: 상부 복공판, 엄지말뚝, 띠장, 다단 버팀보(Strut), 중간말뚝이 웅장하게 결합된 전경",summary:"엄지말뚝, 토류판, 띠장, 버팀보, 화타쐐기, 스크류잭, 브레이싱이 유기적으로 결합된 전체 흙막이 지보 구조입니다.",function:"토압과 수압을 벽체(말뚝+토류판) → 띠장 → 버팀보 순으로 전달하여 굴착 공간을 붕괴 없이 안전하게 확보",constructionStep:"①천공 및 엄지말뚝 근입 → ②복공 주형보/복공판 설치 → ③단계별 굴착 및 토류판 끼움 → ④띠장 거치 및 화타쐐기 밀착 → ⑤버팀보 거치 및 스크류잭 선하중 가압 → ⑥브레이싱 보강",whyNeeded:"지하철, 지하정거장, 고층 빌딩 굴착 시 주변 도로와 건물이 침하되거나 무너지지 않도록 지탱하는 필수 임시 구조물",standardSpec:"KDS 21 30 00 (가설흙막이설계기준), SM355 고강도 구조용 강재 표준",svgType:"OVERVIEW"},{id:"H_PILE",name:"1. 엄지말뚝 (H-Pile)",engName:"Soldier Pile / H-Pile",nickname:"흙막이벽의 든든한 연직 척추 기둥",color:"#0284c7",photoUrl:"/assets/materials/hpile_lagging.jpg",photoCaption:"D500 오거 천공 후 암반층에 근입된 H형강(H-300×305) 엄지말뚝과 하부 시멘트밀크 그라우팅 시공 전경",summary:"지중에 약 1.5~2.0m 간격으로 수직 천공 후 풍화암/연암 지지층까지 박아 넣는 H형강 기둥입니다.",function:"토류판을 양 옆 플랜지 틈새에 끼워 지지하고, 흙이 밀고 들어오는 횡토압을 가장 먼저 받아내는 1차 구조 기둥",constructionStep:"D500mm 오거 천공(GL -35~42m) → H형강 삽입 → 선단 시멘트 밀크 그라우팅 주입 및 고정",whyNeeded:"엄지말뚝이 깊은 암반층(소켓)에 굳건히 박혀있어야 굴착 바닥면 이하의 휨모멘트와 하부 토압을 지탱할 수 있습니다.",standardSpec:"H-300×305×15×15 (SM355, Zx=1,470cm³), H-440×300 (중앙부/주형보용)",svgType:"H_PILE"},{id:"LAGGING",name:"2. 토류판 (Lagging)",engName:"Timber / Steel Lagging",nickname:"말뚝 사이 흙을 막아주는 차수·토류 벽판",color:"#b45309",photoUrl:"/assets/materials/hpile_lagging.jpg",photoCaption:"굴착 진행에 맞춰 엄지말뚝 H형강 플랜지 안쪽에 정밀하게 끼워 넣은 목재 토류판(T=6cm) 시공 실물",summary:"굴착이 한 단계(1.5~2.0m) 진행될 때마다 엄지말뚝과 말뚝 사이 홈에 끼워 넣는 목재 또는 강재 판입니다.",function:"노출된 지층의 흙이 굴착 내부로 쏟아져 내리지 않도록 직접 차단하고 토압을 양쪽 엄지말뚝으로 전달",constructionStep:"지반 굴착(0.5~1.0m 단위) → 엄지말뚝 플랜지 안쪽에 토류판 끼움 → 뒷채움 흙/모래 다짐 및 부직포 설치",whyNeeded:"토류판이 없으면 흙이 무너져 내려 주변 지반이 가라앉고 도로가 붕괴됩니다.",standardSpec:"목재 토류판 T=6.0cm (미송 낙엽송 1등급), 강재 토류판 T=1.2mm (부식방지 아연도금)",svgType:"LAGGING"},{id:"WALE",name:"3. 띠장 (Wale)",engName:"Horizontal Wale Beam",nickname:"여러 말뚝의 토압을 모아주는 수평 들보",color:"#7c3aed",photoUrl:"/assets/materials/wale_wedge_jack.jpg",photoCaption:"엄지말뚝 배면에 보걸이 브라켓(O-1)으로 거치된 2H-300 수평 띠장 및 볼트 결합 상세",summary:"엄지
